<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyAI - Unit Tests</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #e2e8f0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }
        .btn-secondary {
            background: #374151;
            color: white;
        }
        .btn-secondary:hover {
            background: #4b5563;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }
        .stat-label {
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .stat.passed .stat-value { color: #10b981; }
        .stat.failed .stat-value { color: #ef4444; }
        .stat.total .stat-value { color: #6366f1; }
        .stat.rate .stat-value { color: #fbbf24; }
        .test-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .test-result {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.2);
        }
        .test-result.pass {
            border-left: 3px solid #10b981;
        }
        .test-result.fail {
            border-left: 3px solid #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }
        .test-icon {
            font-size: 1.2rem;
        }
        .test-name {
            flex: 1;
        }
        .test-error {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 8px;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 6px;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #374151;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .all-passed {
            text-align: center;
            padding: 40px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 16px;
            margin-top: 20px;
        }
        .all-passed h2 {
            color: #10b981;
            font-size: 2rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FlyAI Unit Tests</h1>
        <p class="subtitle">Frontend Test Suite</p>

        <div class="controls">
            <button class="btn btn-primary" onclick="runTests()">
                Tests ausführen
            </button>
            <button class="btn btn-secondary" onclick="clearResults()">
                Zurücksetzen
            </button>
        </div>

        <div class="summary">
            <div class="stat passed">
                <div class="stat-value" id="passed-count">-</div>
                <div class="stat-label">Bestanden</div>
            </div>
            <div class="stat failed">
                <div class="stat-value" id="failed-count">-</div>
                <div class="stat-label">Fehlgeschlagen</div>
            </div>
            <div class="stat total">
                <div class="stat-value" id="total-count">-</div>
                <div class="stat-label">Gesamt</div>
            </div>
            <div class="stat rate">
                <div class="stat-value" id="pass-rate">-</div>
                <div class="stat-label">Erfolgsrate</div>
            </div>
        </div>

        <div id="results">
            <div class="loading" id="initial-message">
                <p>Klicke "Tests ausführen" um zu starten</p>
            </div>
        </div>
    </div>

    <script>
        let testResults = [];
        let passed = 0;
        let failed = 0;

        function test(name, fn, category) {
            try {
                fn();
                passed++;
                testResults.push({ name, status: 'pass', error: null, category });
            } catch (error) {
                failed++;
                testResults.push({ name, status: 'fail', error: error.message, category });
            }
        }

        function assertEqual(actual, expected, message = '') {
            if (actual !== expected) {
                throw new Error(`${message} Expected ${expected}, got ${actual}`);
            }
        }

        function assertTrue(value, message = '') {
            if (!value) throw new Error(`${message} Expected true, got ${value}`);
        }

        function assertFalse(value, message = '') {
            if (value) throw new Error(`${message} Expected false, got ${value}`);
        }

        function assertDefined(value, message = '') {
            if (value === undefined || value === null) {
                throw new Error(`${message} Expected defined, got ${value}`);
            }
        }

        function assertContains(str, sub, message = '') {
            if (!str.includes(sub)) throw new Error(`${message} Missing "${sub}"`);
        }

        function assertArrayLength(arr, len, message = '') {
            if (arr.length !== len) throw new Error(`${message} Expected length ${len}, got ${arr.length}`);
        }

        function runTests() {
            testResults = [];
            passed = 0;
            failed = 0;

            document.getElementById('results').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Tests werden ausgeführt...</p>
                </div>
            `;

            setTimeout(() => {
                // ========== SESSION TESTS ==========
                test('Session ID Generierung', () => {
                    const id = 'sess_' + Math.random().toString(36).substr(2, 9);
                    assertTrue(id.startsWith('sess_'));
                    assertTrue(id.length > 10);
                }, 'Session');

                test('LocalStorage speichern/laden', () => {
                    localStorage.setItem('test_item', JSON.stringify({ test: true }));
                    const loaded = JSON.parse(localStorage.getItem('test_item'));
                    assertEqual(loaded.test, true);
                    localStorage.removeItem('test_item');
                }, 'Session');

                // ========== FLIGHT TESTS ==========
                test('Duration parsen (PT2H30M)', () => {
                    const duration = 'PT2H30M';
                    const match = duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?/);
                    const minutes = (parseInt(match[1] || 0) * 60) + parseInt(match[2] || 0);
                    assertEqual(minutes, 150);
                }, 'Flights');

                test('Preis parsen', () => {
                    const price = parseFloat("89.50");
                    assertEqual(price, 89.5);
                }, 'Flights');

                test('Flug sortieren nach Preis', () => {
                    const flights = [{ p: 150 }, { p: 50 }, { p: 100 }];
                    const sorted = [...flights].sort((a, b) => a.p - b.p);
                    assertEqual(sorted[0].p, 50);
                }, 'Flights');

                // ========== FILTER TESTS ==========
                test('Filter Direktflüge', () => {
                    const flights = [
                        { segments: 1 }, { segments: 2 }, { segments: 3 }
                    ];
                    const direct = flights.filter(f => f.segments === 1);
                    assertArrayLength(direct, 1);
                }, 'Filter');

                test('Filter nach Max-Preis', () => {
                    const flights = [{ price: 50 }, { price: 150 }];
                    const filtered = flights.filter(f => f.price <= 100);
                    assertArrayLength(filtered, 1);
                }, 'Filter');

                // ========== LOGIN TESTS ==========
                test('Email Validierung (gültig)', () => {
                    const isValid = email => email.includes('@') && email.includes('.');
                    assertTrue(isValid('test@example.com'));
                }, 'Login');

                test('Email Validierung (ungültig)', () => {
                    const isValid = email => email && email.includes('@') && email.includes('.');
                    assertFalse(isValid('invalid'));
                }, 'Login');

                test('Passwort Länge (min 8)', () => {
                    const isValid = pw => pw && pw.length >= 8;
                    assertTrue(isValid('12345678'));
                    assertFalse(isValid('short'));
                }, 'Login');

                test('User speichern', () => {
                    const user = { email: 'test@test.com', name: 'Test' };
                    localStorage.setItem('test_user', JSON.stringify(user));
                    const loaded = JSON.parse(localStorage.getItem('test_user'));
                    assertEqual(loaded.email, 'test@test.com');
                    localStorage.removeItem('test_user');
                }, 'Login');

                // ========== PREISALARM TESTS ==========
                test('Alarm erstellen', () => {
                    const alarm = { id: Date.now(), from: 'BER', to: 'CDG', target: 100 };
                    assertDefined(alarm.id);
                    assertEqual(alarm.from, 'BER');
                }, 'Preisalarm');

                test('Alarm speichern/laden', () => {
                    const alarms = [{ id: 1, active: true }];
                    localStorage.setItem('test_alarms', JSON.stringify(alarms));
                    const loaded = JSON.parse(localStorage.getItem('test_alarms'));
                    assertArrayLength(loaded, 1);
                    localStorage.removeItem('test_alarms');
                }, 'Preisalarm');

                test('Aktive Alarme filtern', () => {
                    const alarms = [{ active: true }, { active: false }, { active: true }];
                    const active = alarms.filter(a => a.active);
                    assertArrayLength(active, 2);
                }, 'Preisalarm');

                // ========== LANGUAGE TESTS ==========
                test('Sprache speichern', () => {
                    localStorage.setItem('lang', 'en');
                    assertEqual(localStorage.getItem('lang'), 'en');
                    localStorage.removeItem('lang');
                }, 'Sprache');

                test('Übersetzung abrufen', () => {
                    const t = { de: { hello: 'Hallo' }, en: { hello: 'Hello' } };
                    assertEqual(t.de.hello, 'Hallo');
                    assertEqual(t.en.hello, 'Hello');
                }, 'Sprache');

                // ========== CART TESTS ==========
                test('Artikel hinzufügen', () => {
                    let cart = [];
                    cart.push({ id: 1, price: 100 });
                    assertArrayLength(cart, 1);
                }, 'Warenkorb');

                test('Gesamtpreis berechnen', () => {
                    const cart = [{ price: 100 }, { price: 50 }];
                    const total = cart.reduce((s, i) => s + i.price, 0);
                    assertEqual(total, 150);
                }, 'Warenkorb');

                test('Artikel entfernen', () => {
                    let cart = [{ id: 1 }, { id: 2 }];
                    cart = cart.filter(i => i.id !== 1);
                    assertArrayLength(cart, 1);
                }, 'Warenkorb');

                // ========== RATE LIMITER TESTS ==========
                test('Rate Limiter erlaubt', () => {
                    const limiter = { count: 5, max: 10 };
                    assertTrue(limiter.count < limiter.max);
                }, 'Rate Limiter');

                test('Rate Limiter blockiert', () => {
                    const limiter = { count: 10, max: 10 };
                    assertFalse(limiter.count < limiter.max);
                }, 'Rate Limiter');

                // ========== API RESPONSE TESTS ==========
                test('Response Type: flight_search', () => {
                    const res = { type: 'flight_search', from: 'BER', to: 'CDG' };
                    assertEqual(res.type, 'flight_search');
                    assertDefined(res.from);
                }, 'API');

                test('Response Type: travel_info', () => {
                    const res = { type: 'travel_info', country: 'Thailand' };
                    assertEqual(res.type, 'travel_info');
                }, 'API');

                // ========== UTILITY TESTS ==========
                test('Datum formatieren', () => {
                    const date = new Date('2026-02-13');
                    const formatted = date.toISOString().split('T')[0];
                    assertEqual(formatted, '2026-02-13');
                }, 'Utilities');

                test('IATA Code extrahieren', () => {
                    const extract = s => {
                        const m = s.match(/\(([A-Z]{3})\)/);
                        return m ? m[1] : s.length === 3 ? s : '';
                    };
                    assertEqual(extract('Berlin (BER)'), 'BER');
                    assertEqual(extract('CDG'), 'CDG');
                }, 'Utilities');

                displayResults();
            }, 500);
        }

        function displayResults() {
            document.getElementById('passed-count').textContent = passed;
            document.getElementById('failed-count').textContent = failed;
            document.getElementById('total-count').textContent = passed + failed;
            document.getElementById('pass-rate').textContent =
                ((passed / (passed + failed)) * 100).toFixed(0) + '%';

            // Gruppiere nach Kategorie
            const categories = {};
            testResults.forEach(r => {
                if (!categories[r.category]) categories[r.category] = [];
                categories[r.category].push(r);
            });

            let html = '';

            const icons = {
                'Session': '📦', 'Flights': '✈️', 'Filter': '🔍',
                'Login': '🔐', 'Preisalarm': '🔔', 'Sprache': '🌍',
                'Warenkorb': '🛒', 'Rate Limiter': '⏱️', 'API': '🌐',
                'Utilities': '🔧'
            };

            for (const [cat, tests] of Object.entries(categories)) {
                const catPassed = tests.filter(t => t.status === 'pass').length;
                const catTotal = tests.length;

                html += `
                    <div class="test-section">
                        <div class="section-title">
                            ${icons[cat] || '📋'} ${cat}
                            <span style="color: ${catPassed === catTotal ? '#10b981' : '#ef4444'}">
                                (${catPassed}/${catTotal})
                            </span>
                        </div>
                        ${tests.map(t => `
                            <div class="test-result ${t.status}">
                                <span class="test-icon">${t.status === 'pass' ? '✅' : '❌'}</span>
                                <span class="test-name">${t.name}</span>
                            </div>
                            ${t.error ? `<div class="test-error">${t.error}</div>` : ''}
                        `).join('')}
                    </div>
                `;
            }

            if (failed === 0) {
                html += `
                    <div class="all-passed">
                        <h2>🎉 Alle Tests bestanden!</h2>
                        <p>Super! Alle ${passed} Tests sind erfolgreich durchgelaufen.</p>
                    </div>
                `;
            }

            document.getElementById('results').innerHTML = html;
        }

        function clearResults() {
            testResults = [];
            passed = 0;
            failed = 0;
            document.getElementById('passed-count').textContent = '-';
            document.getElementById('failed-count').textContent = '-';
            document.getElementById('total-count').textContent = '-';
            document.getElementById('pass-rate').textContent = '-';
            document.getElementById('results').innerHTML = `
                <div class="loading" id="initial-message">
                    <p>Klicke "Tests ausführen" um zu starten</p>
                </div>
            `;
        }
    </script>
</body>
</html>
